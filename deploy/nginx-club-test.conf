# test 环境的 nginx 入口：只监听回环地址，不对外暴露。
#
# 开发者通过 SSH 隧道访问，不需要开安全组、不需要域名、不需要证书：
#
#   ssh -N -L 8080:127.0.0.1:8080 nhyz-prod
#   浏览器打开 http://127.0.0.1:8080/
#
# 依赖：$connection_upgrade 这个 map 由 club.conf 在 http 层定义。
# 同一份 map 不能重复定义（nginx 会报 duplicate map parameter），故此处不重写。

server {
    listen 127.0.0.1:8080;
    server_name _;

    # 上传/附件与生产同量级，避免 test 里因为体积上限出现"生产能传 test 不能传"
    client_max_body_size 50m;

    access_log /var/log/nginx/club-test.access.log;
    error_log  /var/log/nginx/club-test.error.log warn;

    # 静态文件由 nginx 直出：DEBUG=1 时 Django 在 gunicorn 下不服务 /static/
    location /static/ {
        alias /opt/club-test/staticfiles/;
        access_log off;
        expires 1h;
    }

    location /media/ {
        alias /opt/club-test/data/media/;
        access_log off;
        expires 1h;
    }

    location = /favicon.ico {
        alias /opt/club-test/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # WebSocket（/ws/messaging/、/ws/exam-board/）长连接
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
    }
}

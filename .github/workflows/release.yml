name: Release

# SemVer 发布流程（Git Flow，四步，全部可审计）：
#
#   1. 维护者手动 dispatch（选 bump）→ 从 **develop** 切出 release/vX.Y.Z，
#      提交 pyproject 版本号 + CHANGELOG 新小节，对 main 开 PR（冻结窗口开始）
#   2. PR 合入 main（source-guard + 1 人 review + 四道检查）
#   3. main 上 pyproject 版本变了 → 打 tag vX.Y.Z + 建 Release
#      + 关掉同名 Milestone + 开下一个版本的 Milestone
#   4. 自动开一个 main → develop 的回流 PR（Git Flow 强制项：
#      不回流，下一个 release 会把修好的 bug 原样带回来）
#
# 为什么不直接 push 版本提交：main 有分支保护，任何直推都会被拒。
# 发布也必须是 PR——这样「这次发布的变更集」本身就是被评审过的东西。
#
# 为什么不从 commit message 猜版本位：BREAKING 靠正则猜错一次就会让下游
# 在升级时炸掉。版本位由人显式选，机器只负责算数与执行。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "版本位（仓库还没有 v* tag 时一律落到 1.0.0）"
        type: choice
        options: [patch, minor, major]
        default: patch
      version_override:
        description: "可选：直接指定 X.Y.Z（优先级高于 bump）"
        type: string
        required: false
      finish:
        description: "只补做收尾：填 1，且 --ref main。用于合并后 push 事件没送达 GitHub 的情况"
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 1. 准备发布 PR（仅手动触发）────────────────────────────────────────
  prepare:
    name: prepare
    # finish=1 时跳过发起，只跑收尾（tag / Release / Milestone / 回流）
    if: github.event_name == 'workflow_dispatch' && inputs.finish != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Git Flow：release 分支从 develop 切，不从 main 切。
          # 从 main 切会把 develop 上已集成但未发布的改动漏掉。
          ref: develop
          fetch-depth: 0          # 生成变更记录要完整历史
          fetch-tags: true

      - name: Compute next version
        id: calc
        env:
          BUMP: ${{ inputs.bump }}
          OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail
          git config user.name  "Echo"
          git config user.email "echo@hermes.local"

          args=(--bump "$BUMP")
          if [ -n "$OVERRIDE" ]; then args=(--override "$OVERRIDE"); fi

          out=$(python3 scripts/bump_version.py "${args[@]}")
          echo "$out"
          NEW=$(echo "$out" | sed -n 's/.*next=\([0-9.]*\).*/\1/p')
          [ -n "$NEW" ] || { echo "::error::算不出版本号"; exit 1; }
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Open release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.calc.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/v${VERSION}"

          git checkout -b "$BRANCH"
          git add pyproject.toml CHANGELOG.md
          if git diff --cached --quiet; then
            echo "::error::版本号没有变化（当前已经是 v${VERSION}？）"
            exit 1
          fi
          git commit -m "chore(release): v${VERSION}"
          git push -u origin "$BRANCH"

          {
            echo "## 发布 v${VERSION}"
            echo
            echo "由 Release workflow 自动生成。合并后会自动打 tag \`v${VERSION}\` 并建 Release。"
            echo
            echo "### 本次提交的变更"
            echo
            sed -n '/^## \[/,$p' CHANGELOG.md | head -120
            echo
            echo "---"
            echo
            echo "### 合并前请补一句人话"
            echo
            echo '社员看到的更新弹窗读的是 `CHANGELOG.md` 这一节的引用块。自动生成的条目是'
            echo 'commit 原文（`**ci**: 恢复打包 job` 这种），只有人能把「改了什么」翻译成'
            echo '「和你有什么关系」。请在本分支的 CHANGELOG 该节标题下加一行：'
            echo
            echo '```markdown'
            echo '> 页面底部现在能看到版本号，发版后会告诉你这次改了什么。'
            echo '```'
            echo
            echo "没有这句也不影响发版，弹窗里就只剩条目——但那就等于没写。"
          } > /tmp/pr-body.md

          # 建 PR 依赖组织级 can_approve_pull_request_reviews（2026-11-21 已开）。
          # 但它随时可能被策略收回（收回时 GitHub 会拒绝创建 PR），所以这里不假设
          # 一定成功：分支已经推上去了，最坏情况只是把那次点击交还给人。
          if gh pr create \
               --base main \
               --head "$BRANCH" \
               --title "chore(release): v${VERSION}" \
               --body-file /tmp/pr-body.md; then
            echo "已自动创建发布 PR"
          else
            echo "::warning::无法自动建 PR，分支已推送，请手动开："
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            {
              echo "## 发布分支已就绪 · v${VERSION}"
              echo
              echo "Actions 无权创建 PR（组织策略）。点这里开 PR："
              echo
              echo "<https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1>"
              echo
              echo "分支：\`${BRANCH}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

  # ── 2. main 上版本变了 → 打 tag + 建 Release（串在所有闸门之后）────────
  tag:
    name: tag
    if: github.event_name == 'push' || inputs.finish == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read versions
        id: v
        run: |
          set -euo pipefail
          NEW=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          [ -n "$NEW" ] || { echo "::error::pyproject.toml 里读不到 version"; exit 1; }

          # 取语义版本最大的 v* tag（git 默认字典序会把 v1.10 排在 v1.9 前面）
          LATEST=$(git tag --list 'v[0-9]*' \
            | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n \
            | tail -1)

          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "latest=${LATEST:-}" >> "$GITHUB_OUTPUT"

          if [ "$NEW" = "$LATEST" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "版本未变化（已是 v${NEW}），跳过打 tag"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "将打 tag：v${NEW}（上一个 v${LATEST:-无}）"
          fi

      - name: Create tag and release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.new }}
          PREV: ${{ steps.v.outputs.latest }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          git config user.name  "Echo"
          git config user.email "echo@hermes.local"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

          # 变更记录：上一个 v* tag 到本次 tag
          if [ -n "$PREV" ]; then
            python3 scripts/release_notes.py --since "v${PREV}" --until "$TAG" > /tmp/notes.md
          else
            echo "首个版本，变更记录见仓库 CHANGELOG.md 的 \`[${VERSION}]\` 小节。" > /tmp/notes.md
          fi

          {
            echo "**本站版本 ${TAG}**"
            echo
            cat /tmp/notes.md
            echo
            echo "---"
            echo "完整历史：\`CHANGELOG.md\`　·　容器部署：\`deploy/README.md\`"
            if [ -n "$PREV" ]; then
              echo "对比：https://github.com/${GITHUB_REPOSITORY}/compare/v${PREV}...${TAG}"
            fi
          } > /tmp/release-body.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-body.md

      # ── 调试包：源码 + test 环境编排，挂到同一个 Release ────────────────
      # 为什么是 Release 资产而不是 Actions artifact：artifact 默认 90 天过期
      # 且需要登录下载；调试包是给「想在自己机器上复现这个版本」的人用的，
      # 应该和版本一起长期存在。
      - name: Upload debug package
        if: steps.v.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.new }}
        run: |
          set -euo pipefail
          bash scripts/pack-debug.sh "$VERSION" "$RUNNER_TEMP/debug"
          gh release upload "v${VERSION}" \
            "$RUNNER_TEMP/debug/club-${VERSION}-debug.tar.gz" \
            "$RUNNER_TEMP/debug/club-${VERSION}-debug.tar.gz.sha256" --clobber
          echo "::notice::调试包已上传：club-${VERSION}-debug.tar.gz"

      # ── 镜像也打版本 tag，回滚时是人可读的名字而不是一串 sha ──────────
      - name: Tag container image with version
        if: steps.v.outputs.skip != 'true'
        continue-on-error: true
        env:
          VERSION: ${{ steps.v.outputs.new }}
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/nhyzcms/club-management-website
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Image workflow 与本 job 都在 main 上并行跑，谁先完成不确定。
          # 等它最多 4 分钟；等不到就跳过（版本 tag 只是给人看的，不影响部署，
          # 部署用的是 sha-<sha>）。
          ok=0
          for i in $(seq 1 12); do
            if docker pull "${IMAGE}:sha-${GITHUB_SHA}"; then ok=1; break; fi
            echo "镜像 sha-${GITHUB_SHA} 还没就绪，20s 后重试（$i/12）"
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "::warning::镜像版本 tag 跳过：sha-${GITHUB_SHA} 尚未推送到 ghcr"
            exit 0
          fi

          docker tag "${IMAGE}:sha-${GITHUB_SHA}" "${IMAGE}:v${VERSION}"
          docker push "${IMAGE}:v${VERSION}"

      # ── Milestone：关掉本版，开下一版 ─────────────────────────────────
      - name: Update milestones
        if: steps.v.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.new }}
        run: python3 scripts/update_milestones.py "$VERSION"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Release"
            echo
            echo "- 版本: \`v${{ steps.v.outputs.new }}\`"
            echo "- 上一个: \`v${{ steps.v.outputs.latest }}\`"
            echo "- 跳过: \`${{ steps.v.outputs.skip }}\`"
            echo "- 调试包: \`club-${{ steps.v.outputs.new }}-debug.tar.gz\`（失败时为 continue-on-error，看该步骤日志）"
            echo "- 状态: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 3. 回流：main → develop（Git Flow 强制项，忘了就会「同一个 bug 修两次」）──
  back-merge:
    name: back-merge
    if: (github.event_name == 'push' || inputs.finish == '1') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: 开回流 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          BRANCH="chore/back-merge-v${VERSION}"

          git fetch origin develop
          AHEAD=$(git rev-list --count "origin/develop..origin/main")
          if [ "$AHEAD" = "0" ]; then
            echo "develop 已包含 main，无需回流"
            exit 0
          fi

          if gh pr list --head "$BRANCH" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "回流 PR 已存在，跳过"
            exit 0
          fi

          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH"
          # 同 prepare：组织策略禁止 Actions 开 PR。分支推上去即可，摘要给直链。
          # 回流这件事不能因为点不了按钮而消失。
          if gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: v${VERSION} 回流 develop" \
            --body "release 合入 main 后自动开的回流 PR。

              Git Flow 里这一步不是可选项：develop 上还留着发布前的代码，不回流的
              直接后果是下一个 release/* 把已经修好的问题原样带回来。确认 CI 绿即可合并。"; then
            echo "已自动创建回流 PR"
          else
            echo "::warning::无法自动建回流 PR，分支已推送：$BRANCH"
            {
              echo "## 回流 PR 待人工创建 · v${VERSION}"
              echo
              echo "<https://github.com/${GITHUB_REPOSITORY}/compare/develop...${BRANCH}?expand=1>"
              echo
              echo "**这一步不能跳过**：不合回 develop，下一个 release 会把已修好的问题带回来。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

name: CI

# 供应链：所有 action 固定到 commit SHA（审计 L-8）。升级时改 SHA 并在行尾注明版本；
# 版本 tag 可变，SHA 不可变。release job 的 contents: write 仅在该 job 生效。

on:
  push:
    # release/* 与 hotfix/* 也要跑：前者是冻结窗口（发版前最后一次全量验证），
    # 后者是线上救火，两条都可能在没有任何 PR 的情况下被直接提交。
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]
  # 手动点火：GitHub 事件投递抽风时（实测 2026-11-13 全组织 0 条 run）
  # 用 `gh workflow run ci.yml --ref <branch>` 直接触发，不依赖 webhook 派发。
  workflow_dispatch:

# PR 上同分支连推时只保留最新一次（旧 run 立即取消，省 runner 与排队时间）。
# main 上不取消：push 到 main 会连锁 release / 镜像发布，取消可能留下半个发布。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  source-guard:
    name: source-guard
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: 校验来源分支
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ] || [ "$BASE_REF" != "main" ]; then
            echo "非 PR→main，跳过"
            exit 0
          fi
          case "$HEAD_REF" in
            release/*|hotfix/*)
              echo "✅ 来源分支 $HEAD_REF 允许合入 main"
              ;;
            *)
              echo "::error::main 只接受 release/* 或 hotfix/*，当前来源是 $HEAD_REF"
              echo "改动请先合到 develop，再从 develop 切 release/*；线上救火走 hotfix/*。"
              exit 1
              ;;
          esac

  docs-guard:
    name: docs-guard
    # 只在 main（push / 目标为 main 的 PR）检查：documentation 分支的 PR 本来就该带 docs/。
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: docs/ 不得出现在 main
        run: |
          if [ -d docs ] && [ -n "$(ls -A docs)" ]; then
            echo "::error::docs/ 已迁出到 documentation 分支维护；请把文档提交到该分支，main 只放代码与运行时资源。"
            exit 1
          fi
          echo "OK：main 不含 docs/"

  # main 只允许 release/* 与 hotfix/* 合入 —— Git Flow 的生产分支闸门。
  # 故意不用 `if:` 跳过 job：必需检查若从未上报，PR 会永远卡在 "Expected"。
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: |
          set -o pipefail
          uv run python manage.py test 2>&1 | tee "$RUNNER_TEMP/backend-test.log"

      # 版本生成脚本自己也要被测：它坏了，只有等镜像构建（几分钟后）才会暴露，
      # 而那是发布链路上最贵的一次等待。
      - name: Build info generator
        run: |
          set -euo pipefail
          bash scripts/gen-build-info.sh "$RUNNER_TEMP/build_info.json"
          python3 -c "
          import json, os, re
          d = json.load(open(os.environ['RUNNER_TEMP'] + '/build_info.json'))
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(-dev\.[0-9]+\.g[0-9a-f]{7})?', d['version']), d['version']
          assert d['channel'] in ('release', 'dev'), d['channel']
          assert d['commit_short'], 'commit_short 为空'
          assert d['built_at'].endswith('Z'), d['built_at']
          print('build_info OK:', d['version'], d['channel'], d['commit_short'])
          "

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Backend · Django 全量测试"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            if [ -f "$RUNNER_TEMP/backend-test.log" ]; then
              echo "- $(grep -E '^Ran [0-9]+ tests' "$RUNNER_TEMP/backend-test.log" | tail -1 || echo '未捕获测试统计')"
              echo "- 结果: $(grep -E '^(OK|FAILED)' "$RUNNER_TEMP/backend-test.log" | tail -1 || echo '未捕获')"
            else
              echo "- 未捕获测试输出（步骤未执行或提前失败）"
            fi
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Check SurveyJS admin assets
        run: test -f frontend/dist/surveyjs/survey.core.min.js

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Frontend · 生产构建"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            if [ -d frontend/dist ]; then
              echo "- 产物: \`frontend/dist\`（$(du -sh frontend/dist | cut -f1)，$(find frontend/dist -type f | wc -l) 个文件）"
              if [ -f frontend/dist/surveyjs/survey.core.min.js ]; then
                echo "- SurveyJS admin 断言: ✅"
              else
                echo "- SurveyJS admin 断言: ❌"
              fi
            else
              echo "- 未生成 \`frontend/dist\`"
            fi
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Frontend · 单元测试（Vitest）"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            if [ -f "$RUNNER_TEMP/vitest.log" ]; then
              files=$(grep -E 'Test Files' "$RUNNER_TEMP/vitest.log" | tail -1 | xargs || true)
              tests=$(grep -E '^ +Tests ' "$RUNNER_TEMP/vitest.log" | tail -1 | xargs || true)
              dur=$(grep -E 'Duration' "$RUNNER_TEMP/vitest.log" | tail -1 | xargs || true)
              echo "- 文件: ${files:-未捕获}"
              echo "- 用例: ${tests:-未捕获}"
              echo "- 耗时: ${dur:-未捕获}"
            else
              echo "- 未捕获测试输出（步骤未执行或提前失败）"
            fi
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    # 阶梯式：守卫 → 单测 → 浏览器全量。
    # e2e 是最贵的一环（约 4 分钟），单测挂了就没必要跑它；
    # 反过来说，单测全绿但 e2e 挂，才是真正值得盯的信号。
    needs: [backend, frontend, frontend-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # ── 触发闸门 ──────────────────────────────────────────────────────
      # e2e 只在「合入 main」这条链上真跑：
      #   1. PR → main  —— 合并前的最后一道闸（发布 PR / 急修 PR）
      #   2. push main  —— 合并后的完整验证
      # develop 的集成验证交给 test 环境（test-env 分支 + Release 调试包），
      # 不再每次推 develop 都烧一遍浏览器全量。
      # 其余走 no-op —— 但 job 本身照常启动并报 success。
      # 这是刻意的：job-level `if:` 会让检查停在 skipped，而 skipped 不会被
      # 分支保护认作通过，PR 就永远合不进去。所以闸门放在 step 层。
      - name: Decide whether to run
        id: gate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          run=false
          reason=""

          if [ "$EVENT" = "push" ]; then
            case "$REF" in
              refs/heads/main) run=true; reason="push 到 main" ;;
              *)               reason="push 到非 main 分支" ;;
            esac
          elif [ "$BASE_REF" = "main" ] && [ -n "$PR_NUMBER" ]; then
            # 发布 PR（release→main）和急修 PR（hotfix→main）是最后一道闸，
            # 这里省掉的每一分钟都要用一次线上事故去还。
            run=true; reason="PR→main（发布/急修，必跑）"
          else
            reason="PR 指向 ${BASE_REF:-未知}，非 main 不跑"
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "e2e gate: run=$run —— $reason"

      - name: Skip notice
        if: steps.gate.outputs.run != 'true'
        run: |
          {
            echo "## E2E · 已跳过"
            echo
            echo "- **状态**: 跳过（原因：${{ steps.gate.outputs.reason }}）"
            echo "- e2e 只在合入 \`main\` 时运行（PR→main / push main）。"
            echo "- develop 的集成验证走 test 环境：\`test-env\` 分支自动合并 develop 并部署。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::e2e 跳过：${{ steps.gate.outputs.reason }}"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.gate.outputs.run == 'true'

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Download frontend dist
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Playwright browser
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: |
          # ubuntu-24.04 runner 镜像已预装 Chromium 运行库，--with-deps 只是附加保险。
          # 托管 runner 的 Ubuntu 镜像源偶发 DNS 故障（Temporary failure resolving
          # 'azure.archive.ubuntu.com'）会让 apt 以 code 100 退出，从而整步失败，
          # 因此把系统依赖安装降级为「失败仅告警」，并对浏览器下载本身重试。
          npx playwright install-deps chromium \
            || echo "::warning::系统依赖安装失败（apt 不可用），改用 runner 镜像预装依赖"
          for i in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            echo "chromium 下载第 $i 次失败，15s 后重试"
            sleep 15
          done
          echo "::error::Playwright chromium 安装失败"
          exit 1

      - name: Run E2E tests
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Upload Playwright report
        if: steps.gate.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Job summary
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          {
            echo "## E2E · 浏览器测试（Playwright / chromium）"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            if [ -f "$RUNNER_TEMP/e2e.log" ]; then
              result=$(grep -E '[0-9]+ (passed|failed|flaky|skipped)' "$RUNNER_TEMP/e2e.log" | tail -3 | xargs || true)
              echo "- 结果: ${result:-未捕获}"
            else
              echo "- 未捕获测试输出（步骤未执行或提前失败）"
            fi
            echo "- 失败产物: \`playwright-report\` artifact（含 trace 回放）"
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"


  # ── 最后一个：把可运行的运行时树打包，供其他开发者下载 ──────────────
  # 不再喂更新器（那条链路已经是容器 CD）。两种出口：
  #   · 该提交正好是版本发布点（有 v* tag）→ 挂到那个 Release 的资产里
  #   · 普通提交 → 挂成本次 workflow 的 artifact（Actions 页面直接下）
  # 刻意不恢复「每次提交建一个 club-<sha> Release」：那会立刻把 Releases 页面
  # 堆回几百条噪声，之前刚清理过。
  release:
    name: release
    needs: [backend, frontend, frontend-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Pack tarball
        run: bash scripts/pack-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-tarball
          path: |
            club-*.tar.gz
            club-*.tar.gz.sha256
          retention-days: 90

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 等 release.yml 的 tag job 落 tag（跑在同一 push 上，通常更快）
          TAG=""
          for _ in $(seq 1 18); do
            TAG=$(git tag --points-at HEAD --list 'v*' | sort -V | tail -1 || true)
            [ -n "$TAG" ] && break
            sleep 10
          done
          if [ -z "$TAG" ]; then
            echo "本次提交不是版本发布点 —— 不作为发布包出口（每个版本只发一份）"
            exit 0
          fi

          # 等 release.yml 把 Release 建好，别抢在它前面建出一个没有变更说明的空壳
          for _ in $(seq 1 18); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done

          ASSETS=("club-${GITHUB_SHA}.tar.gz" "club-${GITHUB_SHA}.tar.gz.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            echo "已挂到 Release $TAG"
          else
            # 兜底：Release 迟迟没建（比如 release.yml 挂了），用现有 tag 建，
            # 保证开发者总能从 Releases 页面拿到包。
            gh release create "$TAG" "${ASSETS[@]}" --verify-tag --generate-notes
            echo "Release 由本 job 兜底创建"
          fi

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Release · 可下载运行时包"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            echo "- 文件: \`club-${GITHUB_SHA}.tar.gz\` + \`.sha256\`"
            echo "- 出口: Releases 页面对应版本的资产（每个版本只发一份）"
          } >> "$GITHUB_STEP_SUMMARY"

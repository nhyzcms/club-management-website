name: CI

# 供应链：所有 action 固定到 commit SHA（审计 L-8）。升级时改 SHA 并在行尾注明版本；
# 版本 tag 可变，SHA 不可变。release job 的 contents: write 仅在该 job 生效。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 手动点火：GitHub 事件投递抽风时（实测 2026-11-13 全组织 0 条 run）
  # 用 `gh workflow run ci.yml --ref <branch>` 直接触发，不依赖 webhook 派发。
  workflow_dispatch:

# PR 上同分支连推时只保留最新一次（旧 run 立即取消，省 runner 与排队时间）。
# main 上不取消：push 到 main 会连锁 release / 镜像发布，取消可能留下半个发布。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # e2e 闸门要读 PR 改了哪些文件（/pulls/{n}/files），需要 pull-requests: read
  pull-requests: read

jobs:
  docs-guard:
    name: docs-guard
    # 只在 main（push / 目标为 main 的 PR）检查：documentation 分支的 PR 本来就该带 docs/。
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: docs/ 不得出现在 main
        run: |
          if [ -d docs ] && [ -n "$(ls -A docs)" ]; then
            echo "::error::docs/ 已迁出到 documentation 分支维护；请把文档提交到该分支，main 只放代码与运行时资源。"
            exit 1
          fi
          echo "OK：main 不含 docs/"

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Test
        run: |
          set -o pipefail
          uv run python manage.py test 2>&1 | tee "$RUNNER_TEMP/backend-test.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Backend · Django 全量测试"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            if [ -f "$RUNNER_TEMP/backend-test.log" ]; then
              echo "- $(grep -E '^Ran [0-9]+ tests' "$RUNNER_TEMP/backend-test.log" | tail -1 || echo '未捕获测试统计')"
              echo "- 结果: $(grep -E '^(OK|FAILED)' "$RUNNER_TEMP/backend-test.log" | tail -1 || echo '未捕获')"
            else
              echo "- 未捕获测试输出（步骤未执行或提前失败）"
            fi
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Check SurveyJS admin assets
        run: test -f frontend/dist/surveyjs/survey.core.min.js

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Frontend · 生产构建"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            if [ -d frontend/dist ]; then
              echo "- 产物: \`frontend/dist\`（$(du -sh frontend/dist | cut -f1)，$(find frontend/dist -type f | wc -l) 个文件）"
              if [ -f frontend/dist/surveyjs/survey.core.min.js ]; then
                echo "- SurveyJS admin 断言: ✅"
              else
                echo "- SurveyJS admin 断言: ❌"
              fi
            else
              echo "- 未生成 \`frontend/dist\`"
            fi
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests
        working-directory: frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/vitest.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Frontend · 单元测试（Vitest）"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            if [ -f "$RUNNER_TEMP/vitest.log" ]; then
              files=$(grep -E 'Test Files' "$RUNNER_TEMP/vitest.log" | tail -1 | xargs || true)
              tests=$(grep -E '^ +Tests ' "$RUNNER_TEMP/vitest.log" | tail -1 | xargs || true)
              dur=$(grep -E 'Duration' "$RUNNER_TEMP/vitest.log" | tail -1 | xargs || true)
              echo "- 文件: ${files:-未捕获}"
              echo "- 用例: ${tests:-未捕获}"
              echo "- 耗时: ${dur:-未捕获}"
            else
              echo "- 未捕获测试输出（步骤未执行或提前失败）"
            fi
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    needs: [frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # ── 触发闸门 ──────────────────────────────────────────────────────
      # e2e 在四种情况真正执行：
      #   1. push 到 main     —— 发布前的完整验证
      #   2. push 到 develop  —— 集成分支每次合入都跑一遍
      #   3. PR 打了 ci:full  —— 手动强制全套
      #   4. PR 到 develop 且改动涉及 frontend/  —— 前端改动本来就该跑浏览器测试
      # 其余走 no-op —— 但 job 本身照常启动并报 success。
      # 这是刻意的：job-level `if:` 会让检查停在 skipped，而 skipped 不会被
      # 分支保护认作通过，PR 就永远合不进去。所以闸门放在 step 层。
      - name: Decide whether to run
        id: gate
        env:
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -uo pipefail
          run=false
          reason=""

          if [ "$EVENT" = "push" ]; then
            case "$REF" in
              refs/heads/main)    run=true; reason="push 到 main" ;;
              refs/heads/develop) run=true; reason="push 到 develop（集成验证）" ;;
              *)                  reason="push 到非集成分支" ;;
            esac
          elif [ "$HAS_FULL_LABEL" = "true" ]; then
            run=true; reason="PR 带 ci:full 标签"
          elif [ "$BASE_REF" = "main" ] && [ -n "$PR_NUMBER" ]; then
            # 发布 PR（develop→main）和急修 PR（fix/*→main）是最后一道闸，
            # 这里省掉的每一分钟都要用一次线上事故去还。
            run=true; reason="PR→main（发布/急修，必跑）"
          elif [ "$BASE_REF" = "develop" ] && [ -n "$PR_NUMBER" ]; then
            # 只在前端相关改动时跑：省掉纯后端/文档 PR 的 5 分钟
            CHANGED=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                        --paginate --jq '.[].filename' 2>/dev/null || true)
            if printf '%s\n' "$CHANGED" | grep -qE '^frontend/'; then
              run=true; reason="PR→develop 且改动涉及 frontend/"
            else
              reason="PR→develop，改动未触及 frontend/"
            fi
          else
            reason="PR 指向 ${BASE_REF:-未知}，默认不跑"
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "e2e gate: run=$run —— $reason"

      - name: Skip notice
        if: steps.gate.outputs.run != 'true'
        run: |
          {
            echo "## E2E · 已跳过"
            echo
            echo "- **状态**: 跳过（原因：${{ steps.gate.outputs.reason }}）"
            echo "- 需要全套验证：给本 PR 打 \`ci:full\` 标签，再 re-run 本 workflow。"
            echo "- push 到 \`develop\` / \`main\` 会完整跑 e2e。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::e2e 跳过：${{ steps.gate.outputs.reason }}"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.gate.outputs.run == 'true'

      - name: Install uv
        if: steps.gate.outputs.run == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Python dependencies
        if: steps.gate.outputs.run == 'true'
        run: uv sync --frozen

      - name: Set up Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: npm ci

      - name: Download frontend dist
        if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Install Playwright browser
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: |
          # ubuntu-24.04 runner 镜像已预装 Chromium 运行库，--with-deps 只是附加保险。
          # 托管 runner 的 Ubuntu 镜像源偶发 DNS 故障（Temporary failure resolving
          # 'azure.archive.ubuntu.com'）会让 apt 以 code 100 退出，从而整步失败，
          # 因此把系统依赖安装降级为「失败仅告警」，并对浏览器下载本身重试。
          npx playwright install-deps chromium \
            || echo "::warning::系统依赖安装失败（apt 不可用），改用 runner 镜像预装依赖"
          for i in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            echo "chromium 下载第 $i 次失败，15s 后重试"
            sleep 15
          done
          echo "::error::Playwright chromium 安装失败"
          exit 1

      - name: Run E2E tests
        if: steps.gate.outputs.run == 'true'
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee "$RUNNER_TEMP/e2e.log"

      - name: Upload Playwright report
        if: steps.gate.outputs.run == 'true' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Job summary
        if: steps.gate.outputs.run == 'true' && always()
        run: |
          {
            echo "## E2E · 浏览器测试（Playwright / chromium）"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            if [ -f "$RUNNER_TEMP/e2e.log" ]; then
              result=$(grep -E '[0-9]+ (passed|failed|flaky|skipped)' "$RUNNER_TEMP/e2e.log" | tail -3 | xargs || true)
              echo "- 结果: ${result:-未捕获}"
            else
              echo "- 未捕获测试输出（步骤未执行或提前失败）"
            fi
            echo "- 失败产物: \`playwright-report\` artifact（含 trace 回放）"
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

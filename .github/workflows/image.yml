name: Image

# 构建生产镜像 → 冒烟测试 → 推 ghcr.io。
#
# 为什么单独一个 workflow：
#   1) 镜像构建 3–5 分钟，不该拖慢 PR 的 backend/frontend 反馈回路；
#   2) deploy.yml 需要「镜像确实产出成功」这个信号，用 workflow_run 串联最直接；
#   3) PR 上只在改动落在容器相关文件（或打了 ci:full）时才跑。

on:
  push:
    # 目前只有 main 会把镜像推送到 GHCR（见文末的 Login / Push 步骤）。
    # develop / release / hotfix 的构建只做冒烟验证，不产出可拉取的镜像。
    # Deploy 只认 main 上完成的 Image run（deploy.yml 的 workflow_run.branches），
    # 所以 develop 的构建不会污染生产待发布队列。
    # release/* 与 hotfix/* 也出镜像：发版前要用预演环境点一遍候选版本，
    # 线上救火要能回滚到那个提交。Deploy 只认 main 的 run，不会误发。
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker/**"
      - ".github/workflows/image.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nhyzcms/club-management-website

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # 版本号要数「距上一个 tag 多少个提交」，并判断父提交的 pyproject 版本，
          # 浅克隆会让这两件事都算错。
          fetch-depth: 0
          fetch-tags: true

      # 版本号在构建前写进构建上下文，随镜像一起走。
      # 不提交进仓库：提交就要每个分支处理冲突，而且总有人忘了改。
      - name: Generate build info
        run: |
          set -euo pipefail
          bash scripts/gen-build-info.sh build_info.json
          python3 -c "import json;d=json.load(open('build_info.json'));print(json.dumps(d,ensure_ascii=False))"
          VERSION=$(python3 -c "import json;print(json.load(open('build_info.json'))['version'])")
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "### 构建版本 \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"

      # 更新说明也进镜像：前端「更新了什么」弹窗读它。
      # 与版本号同源同批生成，避免「版本是 1.0.1、说明还是上一版」这种错位。
      - name: Generate changelog
        run: |
          set -euo pipefail
          python3 scripts/gen_changelog.py --output changelog.json
          python3 -c "import json;d=json.load(open('changelog.json'));print('changelog:', 'null' if d is None else f\"{d['version']} / {len(d['sections'])} 节\")"

          # 冒烟测试要知道「构建时到底写进去了什么」。
          # 解析不出来（null）是合法的——那一版没写说明——但必须显式区分，
          # 否则「没写说明」和「生成脚本坏了」在 CI 里长得一模一样。
          LOG_VERSION=$(python3 -c "import json;d=json.load(open('changelog.json'));print('' if d is None else d['version'])")
          echo "CHANGELOG_VERSION=$LOG_VERSION" >> "$GITHUB_ENV"
          if [ -z "$LOG_VERSION" ]; then
            echo "::warning::这一版没有发行说明（CHANGELOG.md 里没有对应小节），前端不会弹更新提示"
          fi


      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ── 冒烟测试：镜像构建成功 ≠ 镜像能用 ────────────────────────────
      - name: Image layout guard
        run: |
          IMAGE="${IMAGE}:smoke"
          # 修剪逻辑的回归守卫：构建期依赖不该出现在运行时镜像里。
          docker run --rm "$IMAGE" sh -c '
            set -e
            test ! -d /app/frontend/src   || { echo "frontend/src leaked into image"; exit 1; }
            test ! -d /app/frontend/vendor || { echo "frontend/vendor leaked into image"; exit 1; }
            test -d /app/frontend/dist     || { echo "frontend/dist missing"; exit 1; }
            test -f /app/frontend/dist/surveyjs/survey.core.min.js || { echo "surveyjs missing"; exit 1; }
            test -x /app/start.sh
            test -x /app/.venv/bin/gunicorn
            test -x /app/.venv/bin/python
          '
          echo "镜像大小：$(docker image inspect "$IMAGE" --format '{{.Size}}' | awk '{printf "%.0f MB", $1/1024/1024}')"

      - name: Boot smoke test
        run: |
          set -euo pipefail
          IMAGE="${IMAGE}:smoke"
          docker volume create club-smoke >/dev/null
          ENVS=(
            -e DJANGO_DEBUG=1
            -e SECRET_KEY=smoke-test-key-not-a-secret
            -e ALLOWED_HOSTS=localhost,127.0.0.1
            -e DJANGO_DB_FILE=/app/db/smoke.sqlite3
          )

          echo "== migrate =="
          docker run --rm -v club-smoke:/app/db "${ENVS[@]}" "$IMAGE" migrate

          echo "== web (tcp) =="
          docker run -d --name club-smoke -v club-smoke:/app/db "${ENVS[@]}" -p 18000:8000 "$IMAGE" web-tcp

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:18000/site-policy/ >/tmp/policy.json 2>/dev/null; then
              ok=1; break
            fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "::error::容器 60 秒内没有响应 /site-policy/"
            docker logs club-smoke || true
            exit 1
          fi

          echo "site-policy: $(head -c 160 /tmp/policy.json)..."
          python3 -c "import json;json.load(open('/tmp/policy.json'))" || { echo "::error::/site-policy/ 不是 JSON"; exit 1; }

          # SPA 入口：证明 frontend/dist 真的进了镜像并被 Django 托管
          curl -fsS --max-time 5 http://127.0.0.1:18000/ | grep -q 'id="root"' \
            || { echo "::error::SPA 入口未渲染（frontend/dist 可能没进镜像）"; exit 1; }
          echo "SPA 入口 OK"

          # 版本号真的刻进镜像了吗：容器自报的版本必须等于构建前写入的那个
          curl -fsS --max-time 5 http://127.0.0.1:18000/version/ >/tmp/version.json \
            || { echo "::error::/version/ 不可访问"; exit 1; }
          echo "version: $(cat /tmp/version.json)"
          GOT=$(python3 -c "import json;print(json.load(open('/tmp/version.json'))['version'])")
          if [ "$GOT" != "$BUILD_VERSION" ]; then
            echo "::error::镜像内版本 ($GOT) ≠ 构建时写入的版本 ($BUILD_VERSION)"
            exit 1
          fi
          echo "版本戳一致：$GOT"

          # 更新说明同样要能取到：这是「这次的更新」弹窗的唯一数据源。
          # 生产镜像里没有 CHANGELOG.md（.dockerignore 排除了 *.md），
          # 所以 changelog.json 一旦没进去，功能就是静默死亡——没人会收到报错。
          curl -fsS --max-time 5 http://127.0.0.1:18000/changelog/ >/tmp/changelog.json \
            || { echo "::error::/changelog/ 不可访问"; exit 1; }
          echo "changelog: $(cat /tmp/changelog.json)"
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("/tmp/changelog.json"))
          if not isinstance(d, dict) or not {"version", "released", "sections"} <= set(d):
              sys.exit("::error::/changelog/ 形状不对（前端按固定形状解析）")
          want = os.environ.get("CHANGELOG_VERSION", "")
          if want and d["version"] != want:
              sys.exit(f"::error::镜像内更新说明版本 ({d['version']}) ≠ 构建时写入 ({want})")
          if want and not d["sections"]:
              sys.exit("::error::构建时明明有更新说明，镜像里却没有条目")
          print("更新说明 OK：", d["version"], len(d["sections"]), "节")
          PY

      - name: Dump container logs
        if: failure()
        run: docker logs club-smoke 2>&1 | tail -50 || true

      # ── 推送（只有 main 才推）────────────────────────────────────────
      - name: Log in to GHCR
        # 手动 dispatch 也是「我要一个能部署的镜像」——只在 push 时推的话，
        # 补镜像的路径会构建成功、冒烟通过、然后悄悄什么都不推，直到 Deploy 报 manifest unknown。
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        # 手动 dispatch 也是「我要一个能部署的镜像」——只在 push 时推的话，
        # 补镜像的路径会构建成功、冒烟通过、然后悄悄什么都不推，直到 Deploy 报 manifest unknown。
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker tag "${IMAGE}:smoke" "${IMAGE}:sha-${GITHUB_SHA}"
          docker push "${IMAGE}:sha-${GITHUB_SHA}"
          docker tag "${IMAGE}:smoke" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Image · 生产镜像"
            echo
            echo "- **状态**: \`${{ job.status }}\`"
            echo "- 标签: \`${IMAGE}:sha-${{ github.sha }}\`"
            echo "- 提交: \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"

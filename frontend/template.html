<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/static/favicon.ico" />
    <title>南汇一中 · 传媒社</title>
    <script>
      // 首屏防闪烁：在 React 挂载前按已存偏好先落 data-theme。
      // 同时镜像到 Django 后台约定的 theme 键（auto/light/dark），使 /admin/ 自动跟随。
      (function () {
        var k = "cobalt:theme";
        var v = null;
        var isApp = /NhyzClubApp\//.test(navigator.userAgent || "");
        try { v = localStorage.getItem(k); } catch (e) {}
        // App 壳内的一次性迁移（与 theme.ts 的同名逻辑保持一致）：
        // 旧版壳没有任何切换入口，存下来的 "light" 基本都不是有意选择 —— 改判为「跟随系统」。
        // 用户此后主动选浅色/深色会写回 k，迁移标记保证不会再被改回去。
        try {
          if (isApp && !localStorage.getItem("cobalt:theme:app-default-v2")) {
            localStorage.setItem("cobalt:theme:app-default-v2", "1");
            if (v === "light") { v = "system"; localStorage.setItem(k, "system"); }
          }
        } catch (e) {}
        var pref = (v === "light" || v === "dark" || v === "system") ? v : "light";
        // 与 theme.ts 的 getTheme 保持一致：App 壳内没存过偏好时默认「跟随系统」。
        if (!v && isApp) pref = "system";
        var resolved = pref === "system"
          ? ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light")
          : pref;
        var r = document.documentElement;
        r.dataset.theme = resolved;
        r.style.colorScheme = resolved;
        // 地址栏主题色跟随页面底色（深色值 = theme.ts THEME_COLORS.dark，两处需同步）
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", resolved === "dark" ? "#080f17" : "#ffffff");
        try { localStorage.setItem("theme", pref === "system" ? "auto" : pref); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Turnstile api.js 按需加载（见 src/turnstile.ts），未启用时不请求 Cloudflare。 -->
  </body>
</html>

# ── nginx 传输压缩（gzip）──────────────────────────────────────────────
#
# 用途：把下面这组指令放进 nginx 的 server 块（或 http 块）。
#   - 新装机器：scripts/install.sh 生成的站点配置里已经内联了同一组指令；
#   - 存量机器：把本文件的内容插进现有 server 块即可（也可另存为
#     /etc/nginx/conf.d/00-compression.conf —— conf.d 在 http 块内被 include，
#     等同 http 级配置），改完 `nginx -t && systemctl reload nginx`。
#
# 为什么必须显式配置（这是最容易漏的一条）：
#   nginx 的 gzip_types **默认只有 text/html**。application/javascript、
#   text/css、application/json 都不在其中 —— 也就是说「只写 gzip on;」时，
#   前端那几 MB 的 JS 和全部 API JSON 仍然是明文传输的。
#
# 实测（本仓库线上站点，2026-10）：
#   /static/vendor.*.js                     5,789,748 B → 1,405,036 B（4.1×，level 5）
#   /static/surveyjs/survey.core.min.js     同样 content-encoding: gzip
#   /（首页 HTML，经 proxy_pass 回源）       同样 content-encoding: gzip
#
# 自检命令（应输出 content-encoding: gzip）：
#   curl -sI -H 'Accept-Encoding: gzip' https://<域名>/static/<某个哈希产物>.js \
#     | grep -iE 'content-encoding|vary'
#
# 注意：
#   * gzip 是 http / server 级指令 —— 写进 location 块无效，不会报错但也不生效。
#   * gzip_proxied any 才会压 proxy_pass 回源的响应；默认 off 只压 nginx 自己发的
#     响应（静态文件能压、Django 的 HTML/JSON API 不能）。
#   * gzip_min_length 1024：小于 1KB 的响应压缩收益为负（多一层编码开销），跳过。
#   * 不要往 gzip_types 里加图片 / 字体 / 压缩包等本身已压缩的类型。

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;
